version: "3.8"

services:
  traefik:
    image: traefik:v3.6@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
    command:
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=${STACK_NAME:-demo}_proxy
      - --entrypoints.web.address=:80
      - --ping=true
      - --accesslog=true
      - --log.level=INFO
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.labels.traefik == true
      restart_policy:
        condition: on-failure
      update_config:
        order: stop-first
        failure_action: rollback
      resources:
        limits:
          memory: 256M

  website:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    configs:
      - source: website
        target: /usr/share/nginx/html/index.html
        mode: 0444
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      replicas: 2
      labels:
        traefik.enable: "true"
        traefik.http.routers.website.rule: Host(`${DOMAIN:-demo.localhost}`)
        traefik.http.routers.website.entrypoints: web
        traefik.http.services.website.loadbalancer.server.port: "80"
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 15s
      resources:
        limits:
          memory: 128M

networks:
  proxy:
    driver: overlay
    driver_opts:
      encrypted: ""

configs:
  website:
    name: ${STACK_NAME:-demo}_website_${WEBSITE_VERSION:-v1}
    file: ./website/index.html
